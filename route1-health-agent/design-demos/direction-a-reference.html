tems:center;gap:2px;cursor:pointer}.nav-item.active{color:#2588ee;font-weight:750}.nav-dot{width:22px;height:22px;border-radius:8px;background:currentColor;opacity:.9;position:relative}.nav-dot:after{content:"";position:absolute;inset:6px;background:white;border-radius:4px}.chat-page{padding:12px 18px 84px}.chat-head{text-align:center;margin-bottom:18px}.chat-head h2{font-size:21px;margin:0}.chat-head p{font-size:13px;color:#8a93a0;margin:2px}.bubble{max-width:84%;padding:13px 15px;border-radius:19px;font-size:15px;line-height:1.55;margin-bottom:8px;box-shadow:0 7px 22px rgba(66,103,151,.06)}.bubble.user{margin-left:auto;background:#dceeff;border-bottom-right-radius:7px}.bubble.ai{background:white;border-bottom-left-radius:7px}.ai-label{display:flex;gap:8px;align-items:center;color:#398fe8;font-weight:750;font-size:12px;margin:12px 0 6px}.bot{width:27px;height:27px;border-radius:10px;background:linear-gradient(145deg,#a7ddff,#4ba2f3);display:grid;place-items:center;color:white}.receipt{font-size:12px;color:#748296;margin:-2px 0 13px 35px}.suggest-title{display:flex;justify-content:space-between;font-size:14px;font-weight:740;margin:16px 0 8px}.suggest-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.suggest{border:0;border-radius:15px;background:white;padding:11px;text-align:left;font-size:13px;color:#334155;min-height:58px}.composer{position:absolute;left:16px;right:16px;bottom:82px;height:52px;border-radius:27px;background:white;box-shadow:0 8px 30px rgba(59,92,139,.1);display:flex;align-items:center;padding:6px 8px;gap:8px}.composer-mic{width:39px;height:39px;border-radius:50%;border:0;background:#2388ee;color:white;font-weight:900}.composer span{color:#9aa4b2;font-size:13px}.family-page{padding:14px 20px 92px}.bell{width:42px;height:42px;border-radius:15px;background:white;box-shadow:0 8px 24px rgba(56,86,130,.08);display:grid;place-items:center;color:#306fbd;font-size:17px;font-weight:900}.alert-card{padding:18px;background:linear-gradient(135deg,#e9f3ff,#fbfdff);margin-bottom:14px}.alert-card .badge{display:inline-block;background:#fff0dc;color:#a86500;border-radius:20px;padding:5px 10px;font-size:11px;font-weight:760}.alert-card h2{font-size:21px;margin:10px 0 7px}.alert-card p{font-size:13px;line-height:1.55;color:#5f6d7d;margin:0}.action-row{display:flex;gap:8px;margin-top:12px}.primary,.secondary{height:42px;border-radius:13px;padding:0 14px;font-weight:700;font-size:13px;cursor:pointer}.primary{border:0;background:#2c8df4;color:white}.secondary{border:1px solid #d8e3ef;background:white;color:#35445a}.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.feature{height:105px;padding:15px;border-radius:20px;position:relative;overflow:hidden}.feature strong{display:block;font-size:16px;margin-top:14px}.feature small{color:#738093}.feature-mark{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:white;font-weight:850}.feed{padding:15px}.feed-row{display:grid;grid-template-columns:38px 1fr 22px;align-items:center;min-height:57px;border-top:1px solid #edf1f6}.feed-row:first-of-type{border:0}.feed-icon{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800}.feed-title{font-size:13px;font-weight:700}.feed-sub{font-size:11px;color:#8a94a3}

<body><div id="root"></div>
<script type="text/babel">
const iosFrameStyles={wrapper:{display:'inline-block',padding:12,background:'#000',borderRadius:60,boxShadow:'0 0 0 2px #1f2937,0 20px 60px rgba(0,0,0,.3)',position:'relative'},screen:{position:'relative',borderRadius:48,overflow:'hidden',background:'#fff'},statusBar:{position:'absolute',top:0,left:0,right:0,height:54,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 32px',fontSize:16,fontWeight:600,fontFamily:'-apple-system,"SF Pro Text",sans-serif',zIndex:20,pointerEvents:'none'},dynamicIsland:{position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',width:124,height:36,background:'#000',borderRadius:999,zIndex:30},statusIcons:{display:'flex',alignItems:'center',gap:6},signalIcon:{display:'flex',alignItems:'flex-end',gap:2,height:12},signalBar:{width:3,background:'currentColor',borderRadius:1},batteryIcon:{width:26,height:12,border:'1.5px solid currentColor',borderRadius:3,padding:1,position:'relative',opacity:.8},batteryCap:{position:'absolute',top:3,right:-3,width:2,height:6,background:'currentColor',borderRadius:'0 1px 1px 0'},content:{position:'absolute',top:54,left:0,right:0,bottom:34,overflow:'auto'},homeIndicator:{position:'absolute',bottom:10,left:'50%',transform:'translateX(-50%)',width:140,height:5,background:'rgba(0,0,0,.3)',borderRadius:999,zIndex:10}};
function IosFrame({children,width=393,height=852,time='9:41',battery=88}){return <div style={iosFrameStyles.wrapper}><div style={{...iosFrameStyles.screen,width,height}}><div style={iosFrameStyles.statusBar}><span>{time}</span><div style={iosFrameStyles.statusIcons}><div style={iosFrameStyles.signalIcon}>{[4,6,9,11].map(h=><i key={h} style={{...iosFrameStyles.signalBar,height:h}}/>)}</div><svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/><path d="M3 7.5a7 7 0 0110 0M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round"/></svg><div style={iosFrameStyles.batteryIcon}><div style={{width:`${battery}%`,height:'100%',background:'currentColor',borderRadius:1}}/><div style={iosFrameStyles.batteryCap}/></div></div></div><div style={iosFrameStyles.dynamicIsland}/><div style={iosFrameStyles.content}>{children}</div><div style={iosFrameStyles.homeIndicator}/></div></div>}
function Nav({active='首页'}){return <nav className="bottom-nav">{['首页','健康','助手','我的'].map(x=><button key={x} className={'nav-item '+(active===x?'active':'')}><i className="nav-dot"/>{x}</button>)}</nav>}
function ElderHome(){return <div className="screen-content"><main className="page"><div className="topline"><div className="hello"><h1>上午好，王奶奶</h1><div className="sub">愿您今天过得舒心些</div></div><div className="date">9月12日<br/><span className="weather">24°C</span> 晴</div></div><section className="card tasks"><div className="section-head"><div className="section-title">今日待办</div><div className="link">查看全部 ›</div></div><div className="task-row"><span className="task-icon tone-red">药</span><div><span className="task-time">08:30　</span><span className="task-name">服用氨氯地平</span></div><span className="tick">✓</span></div><div className="task-row"><span className="task-icon tone-blue">诊</span><div><span className="task-time">今天　</span><span className="task-name">联系女儿说明近况</span></div><span className="chev">›</span></div></section><section className="voice-zone"><button className="voice-orb" onClick={e=>e.currentTarget.style.boxShadow='0 0 0 28px rgba(68,162,242,.12),0 22px 42px rgba(37,126,231,.25)'}><i className="mic"/></button><div className="voice-title">有什么事，和我说说</div><div className="voice-copy">我在这里，随时听您说</div></section><div className="quick-grid"><button className="quick"><b>我的健康</b><span className="sub">查看个人变化趋势</span></button><button className="quick"><b>隐私设置</b><span className="sub">管理家属共享</span></button></div></main><Nav/></div>}
function Chat(){return <div className="screen-content"><main className="page chat-page"><header className="chat-head"><h2>AI 助手</h2><p>有事情，和我说说</p></header><div className="bubble user">早上脚踝有点肿，鞋都紧了。</div><div className="ai-label"><i className="bot">A</i>安康助手</div><div className="bubble ai">我先帮您记下来。最近有几项变化叠在一起，我建议今天和女儿联系一下。</div><div className="receipt">已记录 · 仅在您允许后与家属协同</div><div className="bubble user">那我现在该做什么？</div><div className="ai-label"><i className="bot">A</i>安康助手</div><div className="bubble ai">先坐下休息，今天别太累。如果呼吸明显困难或突然加重，请立即联系家人或拨打急救电话。</div><div className="suggest-title"><span>您还可以问</span><span className="link">换一批</span></div><div className="suggest-grid"><button className="suggest">我最近的血压怎么样？</button><button className="suggest">帮我记录今晚吃药</button><button className="suggest">为什么建议联系女儿？</button><button className="suggest">这个不要告诉家属</button></div><div className="composer"><button className="composer-mic">◉</button><span>按住说话，或输入文字</span></div></main><Nav active="助手"/></div>}
function Family(){return <div className="screen-content"><main className="page family-page"><div className="topline"><div className="hello"><h1>您好，李芳</h1><div className="sub">今天有一件事值得关注</div></div><div className="bell">1</div></div><section className="card alert-card"><span className="badge">需要联系</span><h2>妈妈最近有几项变化叠在一起</h2><p>活动量下降、走路容易喘、夜间醒来增加，今天又记录到脚踝肿。</p><div className="action-row"><button className="primary">联系妈妈</button><button className="secondary">联系社区医生</button></div></section><div className="feature-grid"><section className="feature tone-red"><span className="feature-mark" style={{background:'#f06b82'}}>药</span><strong>用药与医护</strong><small>今日服药待确认</small></section><section className="feature tone-blue"><span className="feature-mark" style={{background:'#458fee'}}>报</span><strong>本周周报</strong><small>查看个人基线变化</small></section><section className="feature tone-green"><span className="feature-mark" style={{background:'#39b786'}}>家</span><strong>居家安全</strong><small>床到卫生间路线</small></section><section className="feature tone-purple"><span className="feature-mark" style={{background:'#7664df'}}>权</span><strong>共享与隐私</strong><small>按老人授权展示</small></section></div><section className="card feed"><div className="section-head"><div className="section-title" style={{fontSize:17}}>近期动态</div><div className="link">查看全部 ›</div></div><div className="feed-row"><span className="feed-icon tone-red">!</span><div><div className="feed-title">收到一条需要确认的提醒</div><div className="feed-sub">今天 08:05 · 等待家属知悉</div></div><span className="chev">›</span></div><div className="feed-row"><span className="feed-icon tone-green">3D</span><div><div className="feed-title">居家安全行动待处理</div><div className="feed-sub">固定床到卫生间路线上的地毯</div></div><span className="chev">›</span></div></section></main><nav className="bottom-nav">{['首页','周报','消息','我的'].map(x=><button key={x} className={'nav-item '+(x==='首页'?'active':'')}><i className="nav-dot"/>{x}</button>)}</nav></div>}
function App(){return <div className="board"><header className="board-head"><div><div className="board-title">方向 A · 参考图高还原</div><div className="board-note">保留语音球、雾面卡片与家属功能宫格，内容替换为仓库真实状态</div></div><div className="swatches"><i style={{background:'#f5f9ff'}}/><i style={{background:'#2e8cf3'}}/><i style={{background:'#f06b82'}}/><i style={{background:'#39b786'}}/></div></header><div className="phones">{[["老人首页",<ElderHome/>],["AI 助手",<Chat/>],["家属首页",<Family/>]].map(([label,content])=><div key={label}><div className="phone-label">{label}</div><div className="phone-wrap"><IosFrame>{content}</IosFrame></div></div>)}</div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>

function IosFrame({children,width=393,height=852,time='9:41',battery=88}){return <div style={iosFrameStyles.wrapper}><div style={{...iosFrameStyles.screen,width,height}}><div style={iosFrameStyles.statusBar}><span>{time}</span><div style={iosFrameStyles.statusIcons}><div style={iosFrameStyles.signalIcon}>{[4,6,9,11].map(h=><i key={h} style={{...iosFrameStyles.signalBar,height:h}}/>)}</div><svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/><path d="M3 7.5a7 7 0 0110 0M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round"/></svg><div style={iosFrameStyles.batteryIcon}><div style={{width:`${battery}%`,height:'100%',background:'currentColor'}}/><div style={iosFrameStyles.batteryCap}/></div></div></div><div style={iosFrameStyles.dynamicIsland}/><div style={iosFrameStyles.content}>{children}</div><div style={iosFrameStyles.homeIndicator}/></div></div>}
const Nav=({active='首页',family=false})=><nav className="nav">{(family?['首页','周报','消息','我的']:['首页','健康','助手','我的']).map(x=><button className={x===active?'on':''} key={x}>{x}</button>)}</nav>;
function Elder(){return <div className="screen"><main className="page"><header className="headline"><div><h1>王奶奶，早上好</h1><div className="muted">我在这儿，您慢慢说</div></div><span className="status-pill">家属已连接</span></header><section className="voice-block"><button className="orb">●</button><h2>点一下，告诉我</h2><p>身体不舒服、想记事情，都可以说</p></section><button className="sos"><i>!</i>突然很难受，立即求助</button><section className="todo"><div className="section-head"><strong>今天两件事</strong><span>一件一件来</span></div><div className="todo-row"><div><b>确认今天已经服药</b><small>氨氯地平 5mg · 每日一次</small></div><button className="action">已服用</button></div><div className="todo-row"><div><b>联系女儿说明近况</b><small>最近几项变化叠在一起</small></div><button className="action">打电话</button></div></section></main><Nav/></div>}
function Listen(){return <div className="screen"><main className="page listen-page"><h2>AI 助手</h2><div className="muted">说完后会自动发送</div><div className="rings"/><div className="listening">正在听……</div><div className="wave">{[18,32,46,28,50,38,24,42,18].map((h,i)=><i key={i} style={{height:h}}/>)}</div><div className="examples">“我今天走路有点喘”<br/>“昨晚起来了三四次”<br/>“帮我记一下今天的血压”</div><button className="cancel">×　取消</button></main></div>}
function Family(){return <div className="screen"><main className="page family-page"><header className="headline"><div><h1>妈妈需要您联系</h1><div className="muted">安康 Agent · 今天 08:05</div></div><span className="status-pill" style={{background:'#fff0e8',color:'#a94f2d'}}>待处理</span></header><section className="urgent"><div className="urgent-top"><div className="severity">持续变化值得关注</div><h2>活动下降和身体不适同时出现</h2><p>妈妈最近走路容易喘、夜间醒来增多，今天又说脚踝肿。这不是诊断，但建议今天联系确认。</p></div><div className="big-actions"><button className="call">联系妈妈</button><button className="doctor">社区医生</button></div></section><section className="reason"><h3>为什么现在提醒您</h3><div className="evidence"><div className="evidence-row"><span className="metric">活动步数</span><div className="bar"><i style={{width:'42%'}}/></div></div><div className="evidence-row"><span className="metric">夜间醒来</span><div className="bar"><i style={{width:'76%',background:'#f28a67'}}/></div></div><div className="evidence-row"><span className="metric">近期主诉</span><div className="bar"><i style={{width:'88%',background:'#de6673'}}/></div></div></div></section><section className="next"><h3>还有一项居家行动</h3><p>检查床到卫生间路线上的地毯和夜间照明，处理后重新扫描确认。</p><button>进入 3D 居家安全</button></section></main><Nav family/></div>}
function App(){return <div className="board"><header className="board-head"><div><div className="title">方向 B · 适老优先</div><div className="note">更大字号、更少层级，语音与求助永远在首屏；家属端直接给原因和行动</div></div><div className="tags"><span>56px 触控</span><span>高对比</span><span>少滚动</span></div></header><div className="phones">{[['老人首页',<Elder/>],['语音识别',<Listen/>],['家属行动页',<Family/>]].map(([l,c])=><div key={l}><div className="label">{l}</div><div className="phone-wrap"><IosFrame>{c}</IosFrame></div></div>)}</div></div>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>

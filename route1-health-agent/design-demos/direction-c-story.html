<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>方向 C · 比赛叙事</title>
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.27.6/babel.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #111827;
      }
      body {
        background: #e7edf6;
      }
      .board {
        min-height: 960px;
        padding: 34px 30px 18px;
        background: radial-gradient(circle at 14% 0, #fff 0, #eef4fd 35%, #e7edf6 100%);
      }
      .head {
        height: 68px;
        display: flex;
        justify-content: space-between;
        max-width: 1390px;
        margin: auto;
      }
      .title {
        font-size: 26px;
        font-weight: 820;
      }
      .note {
        font-size: 14px;
        color: #637084;
        margin-top: 6px;
      }
      .loop {
        font-size: 12px;
        color: #296bb8;
        background: #e6f2ff;
        border: 1px solid #cfe4fb;
        border-radius: 999px;
        padding: 8px 14px;
        height: max-content;
      }
      .phones {
        display: flex;
        justify-content: center;
        gap: 26px;
      }
      .label {
        text-align: center;
        font-size: 14px;
        color: #586578;
        margin-bottom: 10px;
        font-weight: 750;
      }
      .phone-wrap {
        transform: scale(0.84);
        transform-origin: top center;
        width: 350px;
        height: 744px;
      }
      .screen {
        height: 100%;
        position: relative;
        overflow: hidden;
        background: linear-gradient(170deg, #f9fbff, #eef4fc);
      }
      .page {
        height: 100%;
        overflow: hidden;
        padding: 16px 20px 92px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }
      .brand {
        font-size: 13px;
        color: #2b7dcc;
        font-weight: 850;
        letter-spacing: 0.08em;
      }
      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: linear-gradient(145deg, #98c9ff, #477ddd);
        color: white;
        display: grid;
        place-items: center;
        font-weight: 800;
      }
      .hero {
        background: linear-gradient(145deg, #1b72d6, #57b5f1);
        border-radius: 27px;
        color: white;
        padding: 20px;
        box-shadow: 0 18px 35px rgba(34, 105, 190, 0.24);
        position: relative;
        overflow: hidden;
        margin-bottom: 13px;
      }
      .hero:after {
        content: '';
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        border: 42px solid rgba(255, 255, 255, 0.09);
        right: -62px;
        top: -77px;
      }
      .hero small {
        font-size: 12px;
        opacity: 0.82;
      }
      .hero h1 {
        font-size: 27px;
        line-height: 1.25;
        margin: 7px 0 9px;
        max-width: 270px;
      }
      .hero p {
        font-size: 13px;
        line-height: 1.55;
        margin: 0;
        opacity: 0.9;
        max-width: 290px;
      }
      .hero-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 15px;
      }
      .hero-stat {
        background: rgba(255, 255, 255, 0.13);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        padding: 9px;
      }
      .hero-stat b {
        display: block;
        font-size: 17px;
      }
      .hero-stat span {
        font-size: 10px;
        opacity: 0.8;
      }
      .explain {
        background: white;
        border-radius: 22px;
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: 0 10px 26px rgba(42, 75, 120, 0.07);
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .section-head h2 {
        font-size: 19px;
        margin: 0;
      }
      .chip {
        font-size: 11px;
        border-radius: 999px;
        padding: 5px 9px;
        background: #eef6ff;
        color: #2776c4;
        font-weight: 800;
      }
      .explain p {
        font-size: 14px;
        color: #536276;
        line-height: 1.55;
        margin: 9px 0 0;
      }
      .voice-dock {
        background: white;
        border-radius: 22px;
        padding: 12px;
        display: grid;
        grid-template-columns: 58px 1fr 36px;
        gap: 11px;
        align-items: center;
        box-shadow: 0 12px 28px rgba(41, 74, 117, 0.08);
      }
      .voice-btn {
        width: 56px;
        height: 56px;
        border: 0;
        border-radius: 18px;
        background: linear-gradient(145deg, #52bff2, #287fe5);
        color: white;
        font-size: 24px;
        font-weight: 900;
        cursor: pointer;
      }
      .voice-dock b {
        font-size: 16px;
      }
      .voice-dock p {
        font-size: 12px;
        color: #748196;
        margin: 3px 0 0;
      }
      .arrow {
        font-size: 27px;
        color: #8fa0b3;
      }
      .task-strip {
        margin-top: 12px;
        display: flex;
        gap: 8px;
      }
      .mini {
        flex: 1;
        background: #fff;
        border-radius: 17px;
        padding: 12px;
        font-size: 12px;
        color: #657286;
      }
      .mini b {
        display: block;
        color: #172033;
        font-size: 14px;
        margin-bottom: 3px;
      }
      .nav {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 10px;
        height: 65px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 12px 32px rgba(41, 69, 108, 0.15);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        padding: 7px;
        backdrop-filter: blur(18px);
      }
      .nav button {
        border: 0;
        background: transparent;
        border-radius: 15px;
        color: #8290a3;
        font-size: 11px;
        cursor: pointer;
      }
      .nav button.on {
        background: #e7f2ff;
        color: #2179d4;
        font-weight: 850;
      }
      .timeline {
        position: relative;
        padding-left: 35px;
      }
      .timeline:before {
        content: '';
        position: absolute;
        left: 13px;
        top: 18px;
        bottom: 18px;
        width: 2px;
        background: #d9e4f0;
      }
      .step {
        position: relative;
        background: white;
        border-radius: 21px;
        padding: 15px;
        margin-bottom: 12px;
        box-shadow: 0 9px 24px rgba(44, 75, 116, 0.07);
      }
      .step:before {
        content: attr(data-n);
        position: absolute;
        left: -35px;
        top: 16px;
        width: 27px;
        height: 27px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: white;
        background: #3388dc;
        font-size: 12px;
        font-weight: 900;
        box-shadow: 0 0 0 6px #eef4fc;
      }
      .step h3 {
        font-size: 16px;
        margin: 0 0 5px;
      }
      .step p {
        font-size: 13px;
        color: #657286;
        line-height: 1.5;
        margin: 0;
      }
      .quote {
        font-size: 18px !important;
        color: #142136 !important;
        font-weight: 750;
      }
      .evidence {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 9px;
      }
      .evidence span {
        font-size: 10px;
        background: #f0f5fb;
        border-radius: 999px;
        padding: 5px 8px;
        color: #59697c;
      }
      .privacy {
        color: #6b5bc8 !important;
        background: #f2efff !important;
      }
      .reply {
        background: linear-gradient(145deg, #eff7ff, #fff);
      }
      .ask {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 15px;
        background: #2b83dc;
        color: white;
        font-size: 14px;
        font-weight: 800;
        margin-top: 11px;
      }
      .flow-head {
        background: #0f2742;
        color: white;
        border-radius: 24px;
        padding: 18px;
        margin-bottom: 13px;
        position: relative;
        overflow: hidden;
      }
      .flow-head:after {
        content: '';
        position: absolute;
        width: 130px;
        height: 130px;
        border: 30px solid rgba(79, 167, 255, 0.13);
        border-radius: 50%;
        right: -45px;
        top: -50px;
      }
      .flow-head .eyebrow {
        font-size: 11px;
        color: #7bc0ff;
        font-weight: 850;
        letter-spacing: 0.1em;
      }
      .flow-head h1 {
        font-size: 24px;
        margin: 7px 0;
      }
      .flow-head p {
        font-size: 13px;
        color: #bbcad9;
        margin: 0;
        max-width: 280px;
      }
      .flow {
        display: grid;
        gap: 9px;
      }
      .flow-card {
        background: white;
        border-radius: 19px;
        padding: 14px;
        display: grid;
        grid-template-columns: 38px 1fr auto;
        align-items: center;
        gap: 10px;
        box-shadow: 0 8px 22px rgba(42, 72, 109, 0.06);
      }
      .num {
        width: 35px;
        height: 35px;
        border-radius: 12px;
        background: #e9f4ff;
        color: #2580d4;
        display: grid;
        place-items: center;
        font-weight: 900;
      }
      .flow-card b {
        display: block;
        font-size: 14px;
      }
      .flow-card small {
        font-size: 11px;
        color: #758297;
      }
      .done {
        font-size: 11px;
        color: #138553;
        background: #e8f8ef;
        border-radius: 999px;
        padding: 5px 8px;
        font-weight: 800;
      }
      .current {
        border: 2px solid #8dbfeb;
      }
      .action-card {
        margin-top: 12px;
        background: linear-gradient(135deg, #f0edff, #edf8ff);
        border-radius: 22px;
        padding: 16px;
      }
      .action-card h2 {
        font-size: 18px;
        margin: 0 0 7px;
      }
      .action-card p {
        font-size: 13px;
        color: #59677a;
        line-height: 1.5;
        margin: 0 0 11px;
      }
      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .buttons button {
        height: 44px;
        border-radius: 14px;
        font-size: 13px;
        font-weight: 800;
      }
      .primary {
        background: #267fda;
        color: white;
        border: 0;
      }
      .secondary {
        background: white;
        color: #26374b;
        border: 1px solid #d2ddea;
      }
      .route {
        margin-top: 10px;
        width: 100%;
        height: 50px;
        border: 0;
        border-radius: 16px;
        background: #1a395b;
        color: white;
        font-size: 14px;
        font-weight: 800;
      }
      .legend {
        display: flex;
        gap: 14px;
        color: #68768a;
        font-size: 11px;
        margin: 12px 0 0;
      }
      .legend i {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const iosFrameStyles = {
        wrapper: {
          display: 'inline-block',
          padding: 12,
          background: '#000',
          borderRadius: 60,
          boxShadow: '0 0 0 2px #1f2937,0 20px 60px rgba(0,0,0,.3)',
          position: 'relative',
        },
        screen: { position: 'relative', borderRadius: 48, overflow: 'hidden', background: '#fff' },
        statusBar: {
          position: 'absolute',
          top: 0,
          left: 0,
          right: 0,
          height: 54,
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'space-between',
          padding: '0 32px',
          fontSize: 16,
          fontWeight: 600,
          fontFamily: '-apple-system,"SF Pro Text",sans-serif',
          zIndex: 20,
          pointerEvents: 'none',
        },
        dynamicIsland: {
          position: 'absolute',
          top: 12,
          left: '50%',
          transform: 'translateX(-50%)',
          width: 124,
          height: 36,
          background: '#000',
          borderRadius: 999,
          zIndex: 30,
        },
        statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
        signalIcon: { display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 },
        signalBar: { width: 3, background: 'currentColor', borderRadius: 1 },
        batteryIcon: {
          width: 26,
          height: 12,
          border: '1.5px solid currentColor',
          borderRadius: 3,
          padding: 1,
          position: 'relative',
          opacity: 0.8,
        },
        batteryCap: { position: 'absolute', top: 3, right: -3, width: 2, height: 6, background: 'currentColor' },
        content: { position: 'absolute', top: 54, left: 0, right: 0, bottom: 34, overflow: 'auto' },
        homeIndicator: {
          position: 'absolute',
          bottom: 10,
          left: '50%',
          transform: 'translateX(-50%)',
          width: 140,
          height: 5,
          background: 'rgba(0,0,0,.3)',
          borderRadius: 999,
          zIndex: 10,
        },
      };
      function IosFrame({ children, width = 393, height = 852, time = '9:41', battery = 88 }) {
        return (
          <div style={iosFrameStyles.wrapper}>
            <div style={{ ...iosFrameStyles.screen, width, height }}>
              <div style={iosFrameStyles.statusBar}>
                <span>{time}</span>
                <div style={iosFrameStyles.statusIcons}>
                  <div style={iosFrameStyles.signalIcon}>
                    {[4, 6, 9, 11].map((h) => (
                      <i key={h} style={{ ...iosFrameStyles.signalBar, height: h }} />
                    ))}
                  </div>
                  <svg width="16" height="12" viewBox="0 0 16 12">
                    <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
                    <path
                      d="M3 7.5a7 7 0 0110 0M1 4.5a11 11 0 0114 0"
                      stroke="currentColor"
                      strokeWidth="1.3"
                      fill="none"
                      strokeLinecap="round"
                    />
                  </svg>
                  <div style={iosFrameStyles.batteryIcon}>
                    <div style={{ width: `${battery}%`, height: '100%', background: 'currentColor' }} />
                    <div style={iosFrameStyles.batteryCap} />
                  </div>
                </div>
              </div>
              <div style={iosFrameStyles.dynamicIsland} />
              <div style={iosFrameStyles.content}>{children}</div>
              <div style={iosFrameStyles.homeIndicator} />
            </div>
          </div>
        );
      }
      const Nav = ({ active = '首页', family = false }) => (
        <nav className="nav">
          {(family ? ['首页', '周报', '消息', '我的'] : ['首页', '健康', '助手', '我的']).map((x) => (
            <button key={x} className={x === active ? 'on' : ''}>
              {x}
            </button>
          ))}
        </nav>
      );
      function Elder() {
        return (
          <div className="screen">
            <main className="page">
              <header className="top">
                <div>
                  <div className="brand">ANKANG AGENT</div>
                  <div style={{ fontSize: 13, color: '#748196', marginTop: 4 }}>正在认识王秀兰奶奶的日常状态</div>
                </div>
                <span className="avatar">王</span>
              </header>
              <section className="hero">
                <small>今天发现一组持续变化</small>
                <h1>最近的状态，和平时有些不一样</h1>
                <p>我会先解释清楚，再告诉您现在最值得做什么。</p>
                <div className="hero-stats">
                  <div className="hero-stat">
                    <b>2,320</b>
                    <span>今日步数</span>
                  </div>
                  <div className="hero-stat">
                    <b>4 次</b>
                    <span>夜间醒来</span>
                  </div>
                  <div className="hero-stat">
                    <b>64.1</b>
                    <span>体重 kg</span>
                  </div>
                </div>
              </section>
              <section className="explain">
                <div className="section-head">
                  <h2>我为什么在意</h2>
                  <span className="chip">个人基线</span>
                </div>
                <p>活动下降、走路喘和脚踝肿同时出现。单个数字不说明疾病，但几项变化叠在一起值得联系家人。</p>
              </section>
              <section className="voice-dock">
                <button className="voice-btn">●</button>
                <div>
                  <b>现在感觉怎么样？</b>
                  <p>点一下，说给我听</p>
                </div>
                <span className="arrow">›</span>
              </section>
              <div className="task-strip">
                <div className="mini">
                  <b>今日用药</b>氨氯地平待确认
                </div>
                <div className="mini">
                  <b>家庭协同</b>先询问您再共享
                </div>
              </div>
            </main>
            <Nav />
          </div>
        );
      }
      function Agent() {
        return (
          <div className="screen">
            <main className="page">
              <header className="top">
                <div>
                  <div className="brand">一次对话，形成可解释的变化</div>
                  <div style={{ fontSize: 13, color: '#748196', marginTop: 4 }}>隐私与安全等级始终由规则控制</div>
                </div>
                <span className="avatar">AI</span>
              </header>
              <div className="timeline">
                <section className="step" data-n="1">
                  <h3>老人自然表达</h3>
                  <p className="quote">“早上脚踝有点肿，鞋都紧了。”</p>
                  <div className="evidence">
                    <span>主诉：水肿</span>
                    <span>时间：今天早上</span>
                  </div>
                </section>
                <section className="step reply" data-n="2">
                  <h3>结合个人基线解释</h3>
                  <p>最近活动量也在下降，夜间醒来增加。这几项变化同时出现，所以我建议今天联系女儿确认。</p>
                  <div className="evidence">
                    <span>活动量连续下降</span>
                    <span>夜间醒来 4 次</span>
                    <span>走路易喘</span>
                  </div>
                </section>
                <section className="step" data-n="3">
                  <h3>老人决定信息去向</h3>
                  <p>系统会先征求授权，不把完整聊天、风险分数或未授权内容直接发给家属。</p>
                  <div className="evidence">
                    <span className="privacy">仅自己可见</span>
                    <span className="privacy">必要时共享</span>
                  </div>
                  <button className="ask">这件事，可以告诉女儿</button>
                </section>
                <section className="step" data-n="4">
                  <h3>生成真实行动任务</h3>
                  <p>今天让家里人知道这件事，并保留直接拨号入口。</p>
                </section>
              </div>
            </main>
            <Nav active="助手" />
          </div>
        );
      }
      function Family() {
        return (
          <div className="screen">
            <main className="page">
              <section className="flow-head">
                <div className="eyebrow">PERSON × HOME</div>
                <h1>从发现变化，到把事情做完</h1>
                <p>您只会看到需要介入且已获授权的内容。</p>
              </section>
              <div className="flow">
                <div className="flow-card">
                  <span className="num">1</span>
                  <div>
                    <b>发现个人状态变化</b>
                    <small>活动、夜间状态与近期主诉</small>
                  </div>
                  <span className="done">完成</span>
                </div>
                <div className="flow-card">
                  <span className="num">2</span>
                  <div>
                    <b>老人允许家属协同</b>
                    <small>不暴露完整聊天与原始风险分</small>
                  </div>
                  <span className="done">已授权</span>
                </div>
                <div className="flow-card current">
                  <span className="num">3</span>
                  <div>
                    <b>家属执行今天的行动</b>
                    <small>联系妈妈并确认当前状态</small>
                  </div>
                  <span className="chip">进行中</span>
                </div>
                <div className="flow-card">
                  <span className="num">4</span>
                  <div>
                    <b>居家环境复扫闭环</b>
                    <small>风险消失后才标记解决</small>
                  </div>
                  <span className="arrow">›</span>
                </div>
              </div>
              <section className="action-card">
                <h2>今天先联系妈妈</h2>
                <p>询问呼吸和脚踝肿是否加重；如明显不适，联系社区医生或及时就医。</p>
                <div className="buttons">
                  <button className="primary">联系妈妈</button>
                  <button className="secondary">确认已知悉</button>
                </div>
                <button className="route">进入 3D 空间 · 查看夜间路线风险</button>
                <div className="legend">
                  <span>
                    <i style={{ background: '#2c83da' }} />
                    Person Twin
                  </span>
                  <span>
                    <i style={{ background: '#7a64df' }} />
                    Home Twin
                  </span>
                  <span>
                    <i style={{ background: '#27a777' }} />
                    行动闭环
                  </span>
                </div>
              </section>
            </main>
            <Nav family />
          </div>
        );
      }
      function App() {
        return (
          <div className="board">
            <header className="head">
              <div>
                <div className="title">方向 C · 比赛叙事优先</div>
                <div className="note">把“个人基线 → Agent 解释 → 授权 → 家属行动 → 3D 复扫”做成视觉主线</div>
              </div>
              <div className="loop">Person Twin × Home Twin × Family Action</div>
            </header>
            <div className="phones">
              {[
                ['老人：看懂变化', <Elder />],
                ['Agent：解释变化', <Agent />],
                ['家属：完成行动', <Family />],
              ].map(([l, c]) => (
                <div key={l}>
                  <div className="label">{l}</div>
                  <div className="phone-wrap">
                    <IosFrame>{c}</IosFrame>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>

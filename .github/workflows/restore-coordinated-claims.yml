name: route1-restore-coordinated-claims

on:
  push:
    branches:
      - 'route1/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source and patch coordinated claims
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=5e8e26d56df5ce749404a2455528000ca4a6e163 -- route1-health-agent/src/engine/understanding.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('route1-health-agent/src/engine/understanding.ts')
          text = p.read_text()
          anchor = '''function timeFromText(clause: string, today: string): { scope: TimeScope; eventDate: string | null } {'''
          helper = '''function coordinatedSubjectsFromText(clause: string): ElderSubject[] | null {
            const match = clause.match(
              /^(?:我|本人|我自己)\\s*(?:和|跟|与)\\s*(我老公|我丈夫|老公|丈夫|爱人|老伴|我爸|我父亲|爸爸|父亲|我妈|我母亲|妈妈|母亲|儿子|女儿|哥哥|弟弟|姐姐|妹妹|爷爷|奶奶|外公|外婆|家里人)\\s*(?:都|也)(?=\\S)/,
            );
            if (!match) return null;
            const second = match[1];
            const subject = /(我老公|我丈夫|老公|丈夫|爱人|老伴)/.test(second)
              ? 'spouse'
              : /(我爸|我父亲|爸爸|父亲)/.test(second)
                ? 'father'
                : /(我妈|我母亲|妈妈|母亲)/.test(second)
                  ? 'mother'
                  : 'family_other';
            return ['self', subject];
          }

'''
          if helper not in text:
              text = text.replace(anchor, helper + anchor, 1)
          old = '''    const subject = subjectFromText(clause, subjectsSeen);\n    const isOmittedComparison ='''
          new = '''    const coordinatedSubjects = coordinatedSubjectsFromText(clause);\n    const subject = coordinatedSubjects?.[0] ?? subjectFromText(clause, subjectsSeen);\n    const isOmittedComparison ='''
          text = text.replace(old, new, 1)
          old2 = '''    const status = statusFromText(clause, tags, hasHealthValue);\n    const deathReported = /(去世|过世|死了|死亡|没了)/.test(clause);\n\n    if (deathReported) {'''
          new2 = '''    const status = statusFromText(clause, tags, hasHealthValue);\n    const deathReported = /(去世|过世|死了|死亡|没了)/.test(clause);\n\n    if (coordinatedSubjects && (tags.length > 0 || hasHealthValue) && !deathReported) {\n      for (const coordinatedSubject of coordinatedSubjects) {\n        claims.push({\n          text: clause,\n          subject: coordinatedSubject,\n          status,\n          timeScope: time.scope,\n          eventDate: time.eventDate,\n          tags,\n          hasHealthValue,\n        });\n      }\n      subjectsSeen.push(...coordinatedSubjects);\n      lastTags = tags;\n      lastHealthValue = hasHealthValue;\n      continue;\n    }\n\n    if (deathReported) {'''
          text = text.replace(old2, new2, 1)
          p.write_text(text)
          PY
          npx --yes prettier@3.5.3 --write route1-health-agent/src/engine/understanding.ts
          git add route1-health-agent/src/engine/understanding.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(route1): preserve explicit coordinated health claims"
          git push origin "HEAD:${GITHUB_REF_NAME}"

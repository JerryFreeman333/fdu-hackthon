name: route1-final-reply-bp-fix-temp
on:
  push:
    branches: [route1/final-green]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: route1/final-green
          fetch-depth: 0
      - name: Patch BP reply compatibility
        working-directory: route1-health-agent
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/engine/agent.ts')
          s = p.read_text()
          if "import { extractHealthValues } from './extract';" not in s:
              s = s.replace("import { parsePrivacyIntent } from './privacy';", "import { parsePrivacyIntent } from './privacy';\nimport { extractHealthValues } from './extract';", 1)
          helper = '''\nfunction buildBloodPressureReply(text: string): string | undefined {\n  const values = extractHealthValues(text).filter((value) => value.unit === 'mmHg');\n  const systolic = values.find((value) => value.metric === 'systolic')?.value;\n  const diastolic = values.find((value) => value.metric === 'diastolic')?.value;\n  if (systolic !== undefined && diastolic !== undefined) {\n    return `您刚才说的血压是 ${systolic}/${diastolic} mmHg。先坐下来安静一会儿，再按设备说明复测。单次读数不要自己下结论。`;\n  }\n  if (systolic !== undefined) {\n    return `您刚才说的高压是 ${systolic} mmHg。先坐下来安静一会儿，再按设备说明复测。单次读数不要自己下结论。`;\n  }\n  return undefined;\n}\n'''
          if 'function buildBloodPressureReply(text: string)' not in s:
              marker = 'function buildRuleBasedReply(\n'
              s = s.replace(marker, helper + '\n' + marker, 1)
          old = "  if (newTags.length === 0) {"
          # Insert BP branch before the generic empty-tag branch without changing other rules.
          bp_branch = "  if (newTags.includes('bpHigh')) {\n    const bloodPressureReply = buildBloodPressureReply(arguments[0] as string);\n    if (bloodPressureReply) return bloodPressureReply;\n  }\n"
          # buildRuleBasedReply needs the elder text; change signature and call site minimally.
          s = s.replace(
              "function buildRuleBasedReply(\n  newTags: SymptomTag[],",
              "function buildRuleBasedReply(\n  elderText: string,\n  newTags: SymptomTag[],",
              1,
          )
          s = s.replace("  if (newTags.length === 0) {", bp_branch.replace("arguments[0] as string", "elderText") + "\n  if (newTags.length === 0) {", 1)
          s = s.replace("buildRuleBasedReply(parsed.tags, [], parsed.tags.includes('fall'), context)", "buildRuleBasedReply(userText, parsed.tags, [], parsed.tags.includes('fall'), context)", 1)
          s = s.replace("buildRuleBasedReply(newTags, findings, isNewFall, context)", "buildRuleBasedReply(elderText, newTags, findings, isNewFall, context)")
          p.write_text(s)
      - name: Format and commit
        working-directory: route1-health-agent
        shell: bash
        run: |
          npx --yes prettier@3.5.3 --write src/engine/agent.ts
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add route1-health-agent/src/engine/agent.ts
          git commit -m 'fix(route1): preserve BP values in chat replies'
          git push origin HEAD:route1/final-green

name: route1-format-export

on:
  push:
    branches:
      - route1-security-hardening-2026-09-09
    paths:
      - '.github/workflows/route1-format-export.yml'
      - 'route1-health-agent/**'

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  export-formatted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Format Route 1 with the repository formatter
        working-directory: route1-health-agent
        run: npx --yes prettier@3.5.3 --write .
      - name: Commit formatted files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route1-health-agent
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "chore(route1): apply repository Prettier formatting"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

name: route1 semantic fix once 2

on:
  push:
    branches:
      - 'route1/ci-green-blackbox-2026-09-08'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact semantic fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          understanding = Path('route1-health-agent/src/engine/understanding.ts')
          text = understanding.read_text(encoding='utf-8')

          subject_anchor = "function subjectFromText(clause: string, priorSubjects: ElderSubject[]): ElderSubject {\n"
          recipient_fix = "  // 在“告诉女儿我……”这类句子里，女儿是分享接收人，不是健康事实主体。\n  if (/(?:告诉|通知|跟|让).{0,4}(?:女儿|儿子|孩子|家人).{0,6}(?:我|我的|我自己|本人)/.test(clause)) return 'self';\n\n"
          if recipient_fix not in text:
              if subject_anchor not in text:
                  raise SystemExit('understanding subject anchor not found')
              text = text.replace(subject_anchor, subject_anchor + recipient_fix, 1)

          sleep_anchor = "  // 比较/缓解结构不是“完全没有症状”。"
          sleep_fix = "  // “没睡好”含有口语否定词，但它表达的是已经发生的睡眠问题。\n  if (tags.includes('poorSleep') && /没睡好/.test(clause)) return 'occurred';\n\n"
          if sleep_fix not in text:
              if sleep_anchor not in text:
                  raise SystemExit('understanding sleep anchor not found')
              text = text.replace(sleep_anchor, sleep_fix + sleep_anchor, 1)

          understanding.write_text(text, encoding='utf-8')
          PY

      - name: Format changed file
        working-directory: route1-health-agent
        run: npx --yes prettier@3.5.3 --write src/engine/understanding.ts

      - name: Remove one-time workflow and trigger
        run: |
          rm -f .github/workflows/_route1-semantic-fix-once-2.yml
          rm -f route1-health-agent/.semantic-fix-trigger-2.txt

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add route1-health-agent/src/engine/understanding.ts .github/workflows/_route1-semantic-fix-once-2.yml route1-health-agent/.semantic-fix-trigger-2.txt
          git commit -m 'fix(route1): preserve sleep events and sharing recipients'
          git push

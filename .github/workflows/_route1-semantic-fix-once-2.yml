name: route1 semantic fix once 2

on:
  push:
    branches:
      - 'route1/ci-green-blackbox-2026-09-08'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact semantic fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          agent = Path('route1-health-agent/src/engine/agent.ts')
          text = agent.read_text(encoding='utf-8')
          old = "  // “没吃药/没服药/忘了吃药”表达的是已经发生的用药遗漏，\n  // 虽然表面有否定词，但业务事件本身是“漏服药物”而不是“没有漏服”。\n  if (tags.includes('medicationMissed') && /(没|没有|未|忘|漏).{0,6}(吃|服|用)?(?:了)?药/.test(clause)) {"
          new = "  // “没吃药/没服药/忘了吃药”表达的是已经发生的用药遗漏，\n  // 虽然表面有否定词，但业务事件本身是“漏服药物”而不是“没有漏服”。\n  if (tags.includes('medicationMissed') && /(没|没有|未|忘|漏).{0,6}(吃|服|用)?(?:了)?药/.test(clause)) {"
          if old not in text:
              raise SystemExit('agent medication anchor not found')
          # Keep the existing medication branch intact; insert the sleep special case immediately after it.
          anchor = "    return 'occurred';\n  }\n\n  // 比较/缓解结构不是“完全没有症状”。"
          replacement = "    return 'occurred';\n  }\n\n  // “没睡好”含有口语否定词，但它表达的是已经发生的睡眠问题。\n  if (tags.includes('poorSleep') && /没睡好/.test(clause)) return 'occurred';\n\n  // 比较/缓解结构不是“完全没有症状”。"
          if anchor not in text:
              raise SystemExit('agent sleep anchor not found')
          agent.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          understanding = Path('route1-health-agent/src/engine/understanding.ts')
          text = understanding.read_text(encoding='utf-8')
          anchor = "function subjectFromText(clause: string, priorSubjects: ElderSubject[]): ElderSubject {\n  if (/(我老公|我丈夫|老公|丈夫|爱人)/.test(clause)) return 'spouse';"
          replacement = "function subjectFromText(clause: string, priorSubjects: ElderSubject[]): ElderSubject {\n  // 在“告诉女儿我……”这类句子里，女儿是分享接收人，不是健康事实主体。\n  if (/(?:告诉|通知|跟|让).{0,4}(?:女儿|儿子|孩子|家人).{0,6}(?:我|我的|我自己|本人)/.test(clause)) return 'self';\n\n  if (/(我老公|我丈夫|老公|丈夫|爱人)/.test(clause)) return 'spouse';"
          if anchor not in text:
              raise SystemExit('understanding recipient anchor not found')
          understanding.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Format changed files
        working-directory: route1-health-agent
        run: npx --yes prettier@3.5.3 --write src/engine/agent.ts src/engine/understanding.ts

      - name: Remove one-time workflow
        run: rm -f .github/workflows/_route1-semantic-fix-once-2.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add route1-health-agent/src/engine/agent.ts route1-health-agent/src/engine/understanding.ts .github/workflows/_route1-semantic-fix-once-2.yml
          git commit -m 'fix(route1): preserve sleep events and sharing recipients'
          git push

name: route1 format last

on:
  push:
    branches:
      - 'route1/ci-green-blackbox-2026-09-08'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: route1-health-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format privacy parser
        run: npx --yes prettier@3.5.3 --write src/engine/privacy.ts
      - name: Remove temporary workflow and trigger
        working-directory: .
        run: |
          rm -f .github/workflows/_route1-format-last.yml
          rm -f route1-health-agent/.route1-format-last-trigger.txt
      - name: Commit formatted file
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add route1-health-agent/src/engine/privacy.ts .github/workflows/_route1-format-last.yml route1-health-agent/.route1-format-last-trigger.txt
          git commit -m 'style(route1): format privacy parser with pinned prettier'
          git push

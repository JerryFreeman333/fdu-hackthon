name: route2-surface-walkability-ci

on:
  push:
    branches:
      - main
      - 'route2-*'
    paths:
      - 'route2-home-3d/pipeline/semantic/**'
      - 'route2-home-3d/pipeline/scripts/08_build_surface_route.ps1'
      - '.github/workflows/route2-surface-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'route2-home-3d/pipeline/semantic/**'
      - 'route2-home-3d/pipeline/scripts/08_build_surface_route.ps1'
      - '.github/workflows/route2-surface-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-walkability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile surface pipeline
        working-directory: route2-home-3d/pipeline/semantic
        run: python -m py_compile surface_costmap.py
      - name: Run surface regression tests
        working-directory: route2-home-3d/pipeline/semantic
        run: python -m unittest -v test_surface_costmap.py

name: route1-autoformat-once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'route1-health-agent/**'
      - '.github/workflows/route1-autoformat-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: route1-health-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format Route 1
        run: npx --yes prettier@3.5.3 --write .
      - name: Commit formatting changes
        run: |
          if git diff --quiet -- route1-health-agent; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route1-health-agent
          git commit -m "style(route1): apply Prettier formatting"
          git push

name: route1-multifact-format3-temp

on:
  push:
    branches:
      - route1-multifact

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: route1-health-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx --yes prettier@3.5.3 --write src/engine/understanding.ts tests/multi-fact-regression.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet -- src/engine/understanding.ts tests/multi-fact-regression.test.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/understanding.ts tests/multi-fact-regression.test.ts
          git commit -m "style(route1): format final understanding fix"
          git push

name: route1-format-auto

on:
  push:
    branches:
      - 'route1-security-hardening-2026-09-09'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: route1-health-agent
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: route1-health-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format with repository Prettier
        run: npx --yes prettier@3.5.3 --write .

      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git add route1-health-agent
          git commit -m 'style(route1): apply Prettier formatting'
          git push origin HEAD:route1-security-hardening-2026-09-09

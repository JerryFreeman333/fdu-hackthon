name: route1-format-fix-temp

on:
  push:
    branches:
      - route1-time-understanding

permissions:
  contents: write

jobs:
  format-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: route1-health-agent
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: route1-time-understanding
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: route1-health-agent/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Format final test files
        run: npx --yes prettier@3.5.3 --write tests/blood-pressure-adversarial-blackbox.test.ts tests/subject-attribution.test.ts

      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet -- tests/blood-pressure-adversarial-blackbox.test.ts tests/subject-attribution.test.ts; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/blood-pressure-adversarial-blackbox.test.ts tests/subject-attribution.test.ts
          git commit -m "style(route1): format final test files"
          git push origin HEAD:route1-time-understanding

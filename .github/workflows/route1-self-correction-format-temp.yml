name: route1-self-correction-format-temp

on:
  push:
    branches:
      - route1-self-correction

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: route1-health-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Format self-correction files
        run: npx --yes prettier@3.5.3 --write src/hooks/useElderChat.ts tests/self-correction-regression.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet -- src/hooks/useElderChat.ts tests/self-correction-regression.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useElderChat.ts tests/self-correction-regression.test.ts
          git commit -m "style(route1): format self-correction patch"
          git push

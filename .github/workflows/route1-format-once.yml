name: route1-format-once

on:
  push:
    branches:
      - 'route1/**'
    paths:
      - 'route1-health-agent/**'
      - '.github/workflows/route1-format-once.yml'

concurrency:
  group: route1-format-once-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: route1-health-agent
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format with repository-approved Prettier
        run: npx --yes prettier@3.5.3 --write .

      - name: Commit formatted files
        working-directory: .
        run: |
          if git diff --quiet; then
            echo 'Formatting already clean.'
            exit 0
          fi
          git config user.name 'route1-format-bot'
          git config user.email 'route1-format-bot@users.noreply.github.com'
          git add route1-health-agent
          git commit -m 'chore(route1): apply Prettier 3.5.3 formatting'
          git push

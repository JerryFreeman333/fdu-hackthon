name: route1-patch-ellipsis-claims
on:
  push:
    branches:
      - 'route1/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch omitted parallel claims
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('route1-health-agent/src/engine/understanding.ts')
          text = p.read_text()
          old = '''    const isOmittedParallelAction =\n      explicitTags.length === 0 &&\n      /^(?:我|我自己|本人)(?:也|还|同样)(?:没|没有|未|忘|漏|吃|服|用|量|测|测了|睡)/.test(clause) &&\n      lastTags.length > 0;'''
          new = '''    const isOmittedParallelAction =\n      explicitTags.length === 0 &&\n      /(?:^(?:我|我自己|本人)(?:也|还|同样)|(?:我老公|我丈夫|老公|丈夫|爱人|老伴|我爸|我父亲|爸爸|父亲|我妈|我母亲|妈妈|母亲|儿子|女儿|哥哥|弟弟|姐姐|妹妹|爷爷|奶奶|外公|外婆|家里人)(?:也|还|同样))/.test(clause) &&\n      /(?:没|没有|未|忘|漏|吃|服|用|量|测|测了|睡)/.test(clause) &&\n      lastTags.length > 0;'''
          if old not in text:
              raise SystemExit('expected understanding.ts anchor not found')
          p.write_text(text.replace(old, new, 1))

          t = Path('route1-health-agent/tests/user-diagnostic.test.ts')
          tests = t.read_text()
          anchor = '''  await runCase('pure numeric measurement remains recordable', () => {'''
          additions = '''  await runCase('omitted parallel family action inherits the prior fact safely', () => {\n    const input = understandElderInput('我没吃药，我爸也没吃', TODAY);\n    assert(input.claims.length >= 2, 'parallel family action should preserve both claims');\n    assert(\n      input.claims.some((claim) => claim.subject === 'self' && claim.tags.includes('medicationMissed') && claim.status === 'occurred'),\n      'self medication miss should remain recorded',\n    );\n    assert(\n      input.claims.some((claim) => claim.subject === 'father' && claim.tags.includes('medicationMissed') && claim.status === 'occurred'),\n      'father omitted medication miss should inherit the prior fact',\n    );\n    assert(acceptedSelfClaims(input).length === 1, 'only the self medication fact should enter self health events');\n  });\n\n  await runCase('mixed subjects keep their own state across explicit clauses', () => {\n    const input = understandElderInput('我没胸痛，我老伴昨天胸闷', TODAY);\n    assert(input.claims.some((claim) => claim.subject === 'self' && claim.status === 'negated'), 'self chest-pain denial must stay negated');\n    assert(\n      input.claims.some((claim) => claim.subject === 'spouse' && claim.tags.includes('dyspnea') && claim.status === 'occurred'),\n      'spouse chest tightness must remain a spouse fact',\n    );\n    assert(acceptedSelfClaims(input).length === 0, 'self denial must not become an accepted symptom');\n  });\n\n  await runCase('mixed subjects preserve father measurement without contaminating self', () => {\n    const input = understandElderInput('我没吃药，我爸血压180/110', TODAY);\n    assert(input.claims.some((claim) => claim.subject === 'self' && claim.tags.includes('medicationMissed')), 'self medication miss should remain');\n    assert(\n      input.claims.some((claim) => claim.subject === 'father' && claim.hasHealthValue),\n      'father blood pressure must remain a family measurement',\n    );\n    assert(acceptedSelfClaims(input).filter((claim) => claim.hasHealthValue).length === 0, 'father measurement must never enter self events');\n  });\n\n'''
          if anchor not in tests:
              raise SystemExit('expected test anchor not found')
          t.write_text(tests.replace(anchor, additions + anchor, 1))
          PY
          npx --yes prettier@3.5.3 --write route1-health-agent/src/engine/understanding.ts route1-health-agent/tests/user-diagnostic.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route1-health-agent/src/engine/understanding.ts route1-health-agent/tests/user-diagnostic.test.ts
          git commit -m "fix(route1): preserve omitted parallel family claims"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: route1-diagnose-context

on:
  push:
    branches:
      - route1-context-memory

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch under test
        uses: actions/checkout@v4
        with:
          ref: route1-context-memory
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        working-directory: route1-health-agent
        run: npm ci
      - name: Run complete test command
        working-directory: route1-health-agent
        run: npm test

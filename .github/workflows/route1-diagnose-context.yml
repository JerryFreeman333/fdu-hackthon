name: route1-diagnose-context

on:
  push:
    branches:
      - route1-context-memory

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch under test
        uses: actions/checkout@v4
        with:
          ref: route1-context-memory
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        working-directory: route1-health-agent
        run: npm ci
      - name: Capture test output
        working-directory: route1-health-agent
        run: |
          set +e
          npm test > diagnostic-test-output.txt 2>&1
          status=$?
          echo "TEST_EXIT_CODE=$status" >> diagnostic-test-output.txt
          exit 0
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route1-health-agent/diagnostic-test-output.txt
          git commit -m "chore(route1): capture context test diagnostics"
          git push origin HEAD:route1-context-memory

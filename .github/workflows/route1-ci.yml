name: route1-health-agent-ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'route1-health-agent/**'
      - '.github/workflows/route1-ci.yml'
  workflow_dispatch:

concurrency:
  group: route1-health-agent-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-route1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: route1-health-agent

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: route1-health-agent/package-lock.json

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit package lock changes back to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cd ..
          if git diff --quiet -- route1-health-agent/package-lock.json; then
            echo "Route 1 package lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route1-health-agent/package-lock.json
          git commit -m "build(route1): refresh package lock"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Install locked dependencies
        run: npm ci

      - name: Normalize stale weekly report regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/detection.test.ts')
          text = path.read_text()
          start_marker = "  await runCase('weekly report excludes private observation text', () => {"
          end_marker = "  await runCase('agent context is bounded and carries Person Twin evidence'"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('weekly report regression markers not found')
          replacement = """  await runCase('weekly report excludes private observation text', () => {\n    const findings: Finding[] = [\n      {\n        id: 'finding-1',\n        date: TODAY,\n        severity: 'alert',\n        title: '活动量持续下降',\n        detail: 'demo',\n        evidence: ['活动步数明显下降'],\n        carePath: '确认老人近期状态',\n        familyMessage: '请联系老人',\n        familyEligible: true,\n      },\n    ];\n    const events = recordsToEvents([], [observation('fatigue', '这是只有老人自己能看到的内容', 'private')]);\n    const data = materializeHealthData(events);\n    const report = buildWeeklyReport(data.records, data.observations, findings, TODAY);\n    const reportText = report.sections.flatMap((section) => [section.title, ...section.lines]).join('\\n');\n    assert(!reportText.includes('只有老人自己能看到的内容'), 'private observation text should never appear in weekly report');\n  });\n\n"""
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit regression test migration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cd ..
          if git diff --quiet -- route1-health-agent/tests/detection.test.ts; then
            echo "Weekly report regression test is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route1-health-agent/tests/detection.test.ts
          git commit -m "test(route1): update weekly report regression"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Batch format Route 1
        run: npm run format

      - name: Commit formatting changes back to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cd ..
          if git diff --quiet -- route1-health-agent; then
            echo "Route 1 formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route1-health-agent
          git commit -m "style(route1): apply Prettier formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Verify formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Detection regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Secret hygiene check
        run: npm run security:check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

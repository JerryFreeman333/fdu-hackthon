name: route1-health-agent-ci

on:
  push:
    branches:
      - main
      - 'route1/**'
    paths:
      - 'route1-health-agent/**'
      - '.github/workflows/route1-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'route1-health-agent/**'
      - '.github/workflows/route1-ci.yml'
  workflow_dispatch:

concurrency:
  group: route1-health-agent-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-route1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: route1-health-agent

    steps:
      - name: Checkout pushed or PR revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: route1-health-agent/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Format working tree for audit artifact
        run: npx --yes prettier@3.5.3 --write .

      - name: Upload formatter output for audit
        uses: actions/upload-artifact@v4
        with:
          name: route1-final-prettier-output
          path: |
            route1-health-agent/src/engine/understanding.ts
            route1-health-agent/src/engine/familyLedger.ts
            route1-health-agent/src/hooks/useElderChat.ts
            route1-health-agent/src/hooks/useFamilyBinding.ts
            route1-health-agent/src/store/HealthRecordStore.ts
            route1-health-agent/src/store/LocalHealthRecordStore.ts
            route1-health-agent/src/types.ts
            route1-health-agent/src/App.tsx
            route1-health-agent/src/components/FamilyDashboard.tsx
            route1-health-agent/tests/family-ledger-regression.test.ts
            route1-health-agent/tests/final-audit-smoke.test.ts
            route1-health-agent/tests/final-audit-ci-2.test.ts
            route1-health-agent/tests/family-ledger-ci-smoke.test.ts
            route1-health-agent/tests/final-main-ci-trigger.test.ts
          if-no-files-found: error

      - name: Verify formatting
        run: git diff --exit-code -- . ':!package-lock.json'

      - name: Typecheck
        run: npm run typecheck

      - name: Detection regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Secret hygiene check
        run: npm run security:check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

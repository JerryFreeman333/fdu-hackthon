name: route1-health-agent-ci

on:
  push:
    branches:
      - main
      - 'route1/**'
    paths:
      - 'route1-health-agent/**'
      - '.github/workflows/route1-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'route1-health-agent/**'
      - '.github/workflows/route1-ci.yml'
  workflow_dispatch:

concurrency:
  group: route1-health-agent-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-route1:
    name: Route 1 build, tests and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: route1-health-agent
    steps:
      - name: Checkout revision under test
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: route1-health-agent/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Restore source and commit coordinated-claim fix
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=5e8e26d56df5ce749404a2455528000ca4a6e163 -- route1-health-agent/src/engine/understanding.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('route1-health-agent/src/engine/understanding.ts')
          text = p.read_text()
          anchor = '''function timeFromText(clause: string, today: string): { scope: TimeScope; eventDate: string | null } {'''
          helper = '''function coordinatedSubjectsFromText(clause: string): ElderSubject[] | null {
            const match = clause.match(
              /^(?:我|本人|我自己)\\s*(?:和|跟|与)\\s*(我老公|我丈夫|老公|丈夫|爱人|老伴|我爸|我父亲|爸爸|父亲|我妈|我母亲|妈妈|母亲|儿子|女儿|哥哥|弟弟|姐姐|妹妹|爷爷|奶奶|外公|外婆|家里人)\\s*(?:都|也)(?=\\S)/,
            );
            if (!match) return null;
            const second = match[1];
            const subject = /(我老公|我丈夫|老公|丈夫|爱人|老伴)/.test(second)
              ? 'spouse'
              : /(我爸|我父亲|爸爸|父亲)/.test(second)
                ? 'father'
                : /(我妈|我母亲|妈妈|母亲)/.test(second)
                  ? 'mother'
                  : 'family_other';
            return ['self', subject];
          }

'''
          if helper not in text:
              text = text.replace(anchor, helper + anchor, 1)
          text = text.replace(
              '''    const subject = subjectFromText(clause, subjectsSeen);\n    const isOmittedComparison =''',
              '''    const coordinatedSubjects = coordinatedSubjectsFromText(clause);\n    const subject = coordinatedSubjects?.[0] ?? subjectFromText(clause, subjectsSeen);\n    const isOmittedComparison =''',
              1,
          )
          text = text.replace(
              '''    const status = statusFromText(clause, tags, hasHealthValue);\n    const deathReported = /(去世|过世|死了|死亡|没了)/.test(clause);\n\n    if (deathReported) {''',
              '''    const status = statusFromText(clause, tags, hasHealthValue);\n    const deathReported = /(去世|过世|死了|死亡|没了)/.test(clause);\n\n    if (coordinatedSubjects && (tags.length > 0 || hasHealthValue) && !deathReported) {\n      for (const coordinatedSubject of coordinatedSubjects) {\n        claims.push({\n          text: clause,\n          subject: coordinatedSubject,\n          status,\n          timeScope: time.scope,\n          eventDate: time.eventDate,\n          tags,\n          hasHealthValue,\n        });\n      }\n      subjectsSeen.push(...coordinatedSubjects);\n      lastTags = tags;\n      lastHealthValue = hasHealthValue;\n      continue;\n    }\n\n    if (deathReported) {''',
              1,
          )
          p.write_text(text)
          PY
          npx --yes prettier@3.5.3 --write route1-health-agent/src/engine/understanding.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/route1-ci.yml')
          text = p.read_text()
          text = text.replace('permissions:\n  contents: write', 'permissions:\n  contents: read', 1)
          marker = '      - name: Restore source and commit coordinated-claim fix\n'
          start = text.index(marker)
          end = text.index('      - name: Check formatting\n', start)
          text = text[:start] + text[end:]
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route1-health-agent/src/engine/understanding.ts .github/workflows/route1-ci.yml
          git commit -m "fix(route1): preserve explicit coordinated health claims"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Check formatting
        run: npm run format:check
      - name: Check blackbox syntax
        run: node --check p0-blackbox/run-blackbox.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Security checks
        run: npm run security:check
      - name: Dependency audit (high severity)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (full, informational)
        continue-on-error: true
        run: npm audit --omit=dev

  blackbox-route1:
    name: Route 1 browser black-box
    needs: build-route1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: route1-health-agent/p0-blackbox
    steps:
      - name: Checkout revision under test
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: route1-health-agent/package-lock.json
      - name: Install app dependencies
        run: npm ci
        working-directory: route1-health-agent
      - name: Install black-box dependencies
        run: npm install --no-package-lock
      - name: Check system Chrome
        run: google-chrome --version
      - name: Run browser black-box suite
        run: npm run blackbox

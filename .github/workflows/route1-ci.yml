name: route1-health-agent-ci

on:
  push:
    branches:
      - main
      - 'route1/**'
    paths:
      - 'route1-health-agent/**'
      - '.github/workflows/route1-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'route1-health-agent/**'
      - '.github/workflows/route1-ci.yml'
  workflow_dispatch:

concurrency:
  group: route1-health-agent-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-route1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: route1-health-agent

    steps:
      - name: Checkout revision under test
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: route1-health-agent/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Auto-format working tree
        run: npx --yes prettier@3.5.3 --write .

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route1-health-agent
          git diff --cached --quiet && exit 0
          git commit -m "style(route1): format working tree"
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

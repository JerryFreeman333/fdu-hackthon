name: route1-health-agent-ci

# Final verification pass: this workflow owns the Route 1 build, security, and browser gates.
# The final verification commit intentionally triggers this workflow from main.

on:
  push:
    branches:
      - main
      - 'route1/**'
    paths:
      - 'route1-health-agent/**'
      - '.github/workflows/route1-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'route1-health-agent/**'
      - '.github/workflows/route1-ci.yml'
  workflow_dispatch:

concurrency:
  group: route1-health-agent-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-route1:
    name: Route 1 build, tests and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: route1-health-agent
    steps:
      - name: Checkout revision under test
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: route1-health-agent/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Security checks
        run: npm run security:check
      - name: Dependency audit (high severity)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (full, informational)
        continue-on-error: true
        run: npm audit --omit=dev

  blackbox-route1:
    name: Route 1 browser black-box
    needs: build-route1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: route1-health-agent/p0-blackbox
    steps:
      - name: Checkout revision under test
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: route1-health-agent/package-lock.json
      - name: Install app dependencies
        run: npm ci
        working-directory: route1-health-agent
      - name: Install black-box dependencies
        run: npm install --no-package-lock
      - name: Locate system browser
        id: browser
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "executable=$(command -v google-chrome)" >> "$GITHUB_OUTPUT"
          elif command -v chromium >/dev/null 2>&1; then
            echo "executable=$(command -v chromium)" >> "$GITHUB_OUTPUT"
          else
            echo "executable=" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Chromium fallback
        if: steps.browser.outputs.executable == ''
        run: npx playwright install --with-deps chromium
      - name: Run browser black-box suite
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: ${{ steps.browser.outputs.executable }}
        run: npm run blackbox

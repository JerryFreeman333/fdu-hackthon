name: route1-health-agent-ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'route1-health-agent/**'
      - '.github/workflows/route1-ci.yml'
  workflow_dispatch:

concurrency:
  group: route1-health-agent-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-route1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: route1-health-agent

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: route1-health-agent/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Batch format Route 1
        run: npm run format

      - name: Commit formatting changes back to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cd ..
          if git diff --quiet -- route1-health-agent; then
            echo "Route 1 formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route1-health-agent
          git commit -m "style(route1): apply Prettier formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Verify formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Detection regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Secret hygiene check
        run: npm run security:check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

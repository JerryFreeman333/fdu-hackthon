name: route1-health-agent-ci

on:
  push:
    branches:
      - main
      - 'route1/**'
    paths:
      - 'route1-health-agent/**'
      - '.github/workflows/route1-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'route1-health-agent/**'
      - '.github/workflows/route1-ci.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: route1-health-agent-ci-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-route1:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.event.comment.body == '/route1-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: route1-health-agent

    steps:
      - name: Checkout revision under test
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: route1-health-agent/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Security checks
        run: npm run security:check

      - name: Dependency audit (high severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit (full, informational)
        continue-on-error: true
        run: npm audit --omit=dev

  blackbox-route1:
    needs: build-route1
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.event.comment.body == '/route1-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout revision under test
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: route1-health-agent/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: route1-health-agent

      - name: Install black-box dependencies
        run: npm install --no-package-lock
        working-directory: route1-health-agent/p0-blackbox

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: route1-health-agent/p0-blackbox

      - name: Run final Chromium black-box suite
        run: npm run blackbox
        working-directory: route1-health-agent/p0-blackbox

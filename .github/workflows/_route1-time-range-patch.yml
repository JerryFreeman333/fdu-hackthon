name: route1 time-range semantic patch

on:
  push:
    branches:
      - route1/fix-rhetorical-negation-fall

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'JerryFreeman333'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: route1/fix-rhetorical-negation-fall
      - name: Apply conservative interval semantics and cleanup
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          source = Path('route1-health-agent/src/engine/understanding.ts')
          test = Path('route1-health-agent/tests/time-regression.test.ts')
          workflow = Path('.github/workflows/_route1-time-range-patch.yml')

          source_text = source.read_text()
          old_source = """function timeFromText(clause: string, today: string): { scope: TimeScope; eventDate: string | null } {\n  const daysAgo = clause.match(/(\\d+|一|两|二|三|四|五|六|七|八|九|十)天前/);\n"""
          new_source = """function timeFromText(clause: string, today: string): { scope: TimeScope; eventDate: string | null } {\n  if (/过去(?:\\d+|一|两|二|三|四|五|六|七|八|九|十)天/.test(clause))\n    return { scope: 'historical', eventDate: null };\n  const daysAgo = clause.match(/(\\d+|一|两|二|三|四|五|六|七|八|九|十)天前/);\n"""
          if old_source not in source_text:
              raise SystemExit('timeFromText anchor not found')
          source.write_text(source_text.replace(old_source, new_source, 1))

          test.write_text('''import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { acceptedSelfClaims, understandElderInput } from '../src/engine/understanding';\n\nconst TODAY = '2026-09-10';\n\nconst relativePastCases = [\n  ['我前天胸闷', '2026-09-08'],\n  ['我大前天胸闷', '2026-09-07'],\n  ['我三天前胸闷', '2026-09-07'],\n  ['我3天前胸闷', '2026-09-07'],\n] as const;\n\nfor (const [text, expectedDate] of relativePastCases) {\n  test(`relative past date is exact and never reassigned to today: ${text}`, () => {\n    const input = understandElderInput(text, TODAY);\n    assert.equal(input.claims.length, 1);\n    assert.equal(input.claims[0]?.timeScope, 'historical');\n    assert.equal(input.claims[0]?.eventDate, expectedDate);\n    assert.equal(acceptedSelfClaims(input).length, 1);\n    assert.notEqual(input.claims[0]?.eventDate, TODAY);\n  });\n}\n\ntest('vague multi-day wording does not invent an exact event date', () => {\n  const input = understandElderInput('我过去两天胸闷', TODAY);\n  assert.equal(input.claims.length, 1);\n  assert.equal(input.claims[0]?.timeScope, 'historical');\n  assert.equal(input.claims[0]?.eventDate, null);\n  assert.equal(acceptedSelfClaims(input).length, 0);\n});\n\ntest('current comparison with a health fact still stays on today', () => {\n  const input = understandElderInput('我今天比昨天喘得好多了', TODAY);\n  assert.equal(input.claims[0]?.timeScope, 'today');\n  assert.equal(input.claims[0]?.eventDate, TODAY);\n});\n\ntest('yesterday remains yesterday-scoped', () => {\n  const input = understandElderInput('我昨天胸闷', TODAY);\n  assert.equal(input.claims[0]?.timeScope, 'yesterday');\n  assert.equal(input.claims[0]?.eventDate, '2026-09-09');\n});\n\ntest('last night keeps its dedicated scope and exact date', () => {\n  const input = understandElderInput('我昨晚胸闷', TODAY);\n  assert.equal(input.claims[0]?.timeScope, 'lastNight');\n  assert.equal(input.claims[0]?.eventDate, '2026-09-09');\n});\n''')

          subprocess.run(['npx', '--yes', 'prettier@3.5.3', '--write', str(source), str(test)], check=True)
          subprocess.run(['git', 'config', 'user.name', 'JerryFreeman333'], check=True)
          subprocess.run(['git', 'config', 'user.email', '15957875287@163.com'], check=True)
          subprocess.run(['git', 'add', str(source), str(test)], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(route1): treat multi-day ranges conservatively'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:route1/fix-rhetorical-negation-fall'], check=True)

          workflow.unlink()
          subprocess.run(['git', 'add', '-u', str(workflow)], check=True)
          subprocess.run(['git', 'commit', '-m', 'chore(route1): remove one-shot time patch workflow'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:route1/fix-rhetorical-negation-fall'], check=True)

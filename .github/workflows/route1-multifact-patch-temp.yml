name: route1-multifact-patch-temp

on:
  push:
    branches:
      - route1-multifact

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch multi-fact understanding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('route1-health-agent/src/engine/understanding.ts')
          text = path.read_text()

          split_pattern = re.compile(r"function splitClauses\(text: string\): string\[\] \{.*?\n\}\n\nfunction inferPronounSubject", re.S)
          replacement = r'''function splitClauses(text: string): string[] {
            const protectedNumericComma = text
              .replace(/([0-9零〇一二两三四五六七八九十百]+)\\s*[,，]\\s*(?=[0-9零〇一二两三四五六七八九十百]+)/g, '$1§NUM§')
              .replace(
                /((?:高压|低压|收缩压|舒张压)\\s*(?:[0-9零〇一二两三四五六七八九十百]+))\\s*[,，]\\s*(?=(?:高压|低压|收缩压|舒张压))/g,
                '$1§NUM§',
              );

            const explicitSubjectStart =
              '(?:我老公|我丈夫|老公|丈夫|爱人|我爸|我父亲|爸爸|父亲|我妈|我母亲|妈妈|母亲|我自己|本人|儿子|女儿|哥哥|弟弟|姐姐|妹妹|爷爷|奶奶|外公|外婆|家里人|他|她|他们|她们)';
            const implicitBoundary = protectedNumericComma
              .replace(
                new RegExp(`(?:然后|接着|另外|此外|同时|不过|但是|而且|还有)\\s*(?=${explicitSubjectStart})`, 'g'),
                '§CLAUSE§',
              )
              .replace(
                new RegExp(`([^。！？!?；;,，\\n§])(?=${explicitSubjectStart})`, 'g'),
                '$1§CLAUSE§',
              );

            return implicitBoundary
              .split(/[。！？!?；;,，\\n]+|§CLAUSE§+/)
              .map((clause) => clause.replace(/§NUM§/g, ',').trim())
              .filter(Boolean);
          }

          function inferPronounSubject'''

          updated, count = split_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('splitClauses replacement target not found')
          path.write_text(updated)

          path = Path('route1-health-agent/src/engine/understanding.ts')
          text = path.read_text()
          anchor = "function subjectFromText(clause: string, priorSubjects: ElderSubject[]): ElderSubject {\n  // 在“告诉女儿我……”这类句子里，女儿是分享接收人，不是健康事实主体。"
          replacement = """function subjectFromText(clause: string, priorSubjects: ElderSubject[]): ElderSubject {\n  // 一个分句同时点名多个健康事实主体时，禁止把整句归给第一个匹配到的人。\n  const explicitlyMentionedSubjects = new Set<ElderSubject>();\n  if (/(我老公|我丈夫|老公|丈夫|爱人)/.test(clause)) explicitlyMentionedSubjects.add('spouse');\n  if (/(我爸|我父亲|爸爸|父亲)/.test(clause)) explicitlyMentionedSubjects.add('father');\n  if (/(我妈|我母亲|妈妈|母亲)/.test(clause)) explicitlyMentionedSubjects.add('mother');\n  if (/(儿子|女儿|哥哥|弟弟|姐姐|妹妹|爷爷|奶奶|外公|外婆|家里人)/.test(clause))\n    explicitlyMentionedSubjects.add('family_other');\n  if (/(我自己|本人)/.test(clause)) explicitlyMentionedSubjects.add('self');\n  if (explicitlyMentionedSubjects.size > 1) return 'unknown';\n\n  // 在“告诉女儿我……”这类句子里，女儿是分享接收人，不是健康事实主体。"""
          if anchor not in text:
              raise SystemExit('subjectFromText anchor not found')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)

          test = Path('route1-health-agent/tests/multi-fact-regression.test.ts')
          test.write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { understandElderInput } from '../src/engine/understanding';

          const TODAY = '2026-09-10';

          test('splits unpunctuated multi-person speech before assigning claims', () => {
            const result = understandElderInput(
              '我爸最近有点喘然后我老公昨天摔了一跤另外我自己刚才有点胸闷',
              TODAY,
            );

            assert.equal(result.clarificationQuestion, undefined);
            assert.deepEqual(
              result.claims.map((claim) => [claim.subject, claim.status, claim.tags]),
              [
                ['father', 'occurred', ['dyspnea']],
                ['spouse', 'occurred', ['fall']],
                ['self', 'occurred', ['chestPain']],
              ],
            );
          });

          test('keeps separate family facts instead of inheriting the first family subject', () => {
            const result = understandElderInput('我爸有点喘，我老公也摔了一跤', TODAY);

            assert.equal(result.clarificationQuestion, undefined);
            assert.equal(result.claims.length, 2);
            assert.equal(result.claims[0]?.subject, 'father');
            assert.equal(result.claims[0]?.tags[0], 'dyspnea');
            assert.equal(result.claims[1]?.subject, 'spouse');
            assert.equal(result.claims[1]?.tags[0], 'fall');
          });

          test('clarifies a pronoun when multiple family subjects are active', () => {
            const result = understandElderInput('我爸最近喘，我老公今天也摔了，然后他现在不舒服', TODAY);

            assert.match(result.clarificationQuestion ?? '', /他\/她|指谁/);
            const ambiguous = result.claims.find((claim) => claim.subject === 'unknown');
            assert.ok(ambiguous);
            assert.equal(ambiguous?.text, '他现在不舒服');
          });

          test('does not choose one person when a single clause explicitly names multiple people', () => {
            const result = understandElderInput('我爸和我老公都摔了一跤', TODAY);

            assert.match(result.clarificationQuestion ?? '', /指谁|确认清楚/);
            assert.ok(result.claims.some((claim) => claim.subject === 'unknown'));
          });

          test('keeps a self claim separate from a nearby family claim', () => {
            const result = understandElderInput('我爸走路不稳然后我自己也有点头晕', TODAY);

            assert.equal(result.clarificationQuestion, undefined);
            assert.equal(result.claims[0]?.subject, 'father');
            assert.equal(result.claims[1]?.subject, 'self');
            assert.deepEqual(result.claims[1]?.tags, ['dizziness']);
          });
          ''')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route1-health-agent/src/engine/understanding.ts route1-health-agent/tests/multi-fact-regression.test.ts
          git commit -m "fix(route1): harden multi-fact claim splitting"
          git push

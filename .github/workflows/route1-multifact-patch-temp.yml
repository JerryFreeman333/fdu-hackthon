name: route1-multifact-patch-temp

on:
  push:
    branches:
      - route1-multifact

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch multi-fact understanding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('route1-health-agent/src/engine/understanding.ts')
          text = path.read_text()

          old = """  return protectedNumericComma
    .split(/[。！？!?；;,，\\n]+(?!\\s*(?:也(?:没|没有|未)|并(?:没|没有)|幸好|好在))/)
    .map((clause) => clause.replace(/§/g, ',').trim())
    .filter(Boolean);
"""
          new = """  const explicitSubjectStart =
    /(?=(?:我老公|我丈夫|老公|丈夫|爱人|我爸|我父亲|爸爸|父亲|我妈|我母亲|妈妈|母亲|我自己|本人|儿子|女儿|哥哥|弟弟|姐姐|妹妹|爷爷|奶奶|外公|外婆|家里人|他|她|他们|她们))/;

  const withImplicitBoundaries = protectedNumericComma
    .replace(/(?:然后|接着|另外|此外|同时|不过|但是|而且|还有)\\s*/g, '§CLAUSE§')
    .replace(/([^。！？!?；;,，§])(?=我老公|我丈夫|老公|丈夫|爱人|我爸|我父亲|爸爸|父亲|我妈|我母亲|妈妈|母亲|我自己|本人|儿子|女儿|哥哥|弟弟|姐姐|妹妹|爷爷|奶奶|外公|外婆|家里人|他|她|他们|她们)/g, '$1§CLAUSE§');

  return withImplicitBoundaries
    .split(/[。！？!?；;,，\\n]+|§CLAUSE§+/)
    .map((clause) => clause.replace(/§/g, ',').trim())
    .filter(Boolean);
"""
          if old not in text:
              raise SystemExit('splitClauses return block not found')
          text = text.replace(old, new, 1)

          old_subject = """function subjectFromText(clause: string, priorSubjects: ElderSubject[]): ElderSubject {
  // 在“告诉女儿我……”这类句子里，女儿是分享接收人，不是健康事实主体。
"""
          new_subject = """function subjectFromText(clause: string, priorSubjects: ElderSubject[]): ElderSubject {
  // 一个分句同时点名多个健康事实主体时，禁止把整句归给第一个匹配到的人。
  const explicitlyMentionedSubjects = new Set<ElderSubject>();
  if (/(我老公|我丈夫|老公|丈夫|爱人)/.test(clause)) explicitlyMentionedSubjects.add('spouse');
  if (/(我爸|我父亲|爸爸|父亲)/.test(clause)) explicitlyMentionedSubjects.add('father');
  if (/(我妈|我母亲|妈妈|母亲)/.test(clause)) explicitlyMentionedSubjects.add('mother');
  if (/(儿子|女儿|哥哥|弟弟|姐姐|妹妹|爷爷|奶奶|外公|外婆|家里人)/.test(clause))
    explicitlyMentionedSubjects.add('family_other');
  if (/(我自己|本人)/.test(clause)) explicitlyMentionedSubjects.add('self');
  if (explicitlyMentionedSubjects.size > 1) return 'unknown';

  // 在“告诉女儿我……”这类句子里，女儿是分享接收人，不是健康事实主体。
"""
          if old_subject not in text:
              raise SystemExit('subjectFromText anchor not found')
          text = text.replace(old_subject, new_subject, 1)
          path.write_text(text)

          test = Path('route1-health-agent/tests/multi-fact-regression.test.ts')
          test.write_text('''import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { understandElderInput } from '../src/engine/understanding';\n\nconst TODAY = '2026-09-10';\n\ntest('splits unpunctuated multi-person speech before assigning claims', () => {\n  const result = understandElderInput('我爸最近有点喘然后我老公昨天摔了一跤另外我自己刚才有点胸闷', TODAY);\n\n  assert.equal(result.clarificationQuestion, undefined);\n  assert.deepEqual(\n    result.claims.map((claim) => [claim.subject, claim.status, claim.tags]),\n    [\n      ['father', 'occurred', ['dyspnea']],\n      ['spouse', 'occurred', ['fall']],\n      ['self', 'occurred', ['chestPain']],\n    ],\n  );\n});\n\ntest('keeps separate family facts instead of inheriting the first family subject', () => {\n  const result = understandElderInput('我爸有点喘，我老公也摔了一跤', TODAY);\n\n  assert.equal(result.clarificationQuestion, undefined);\n  assert.equal(result.claims.length, 2);\n  assert.equal(result.claims[0]?.subject, 'father');\n  assert.equal(result.claims[0]?.tags[0], 'dyspnea');\n  assert.equal(result.claims[1]?.subject, 'spouse');\n  assert.equal(result.claims[1]?.tags[0], 'fall');\n});\n\ntest('clarifies a pronoun when multiple family subjects are active', () => {\n  const result = understandElderInput('我爸最近喘，我老公今天也摔了，然后他现在不舒服', TODAY);\n\n  assert.match(result.clarificationQuestion ?? '', /他\\/她|指谁/);\n  const ambiguous = result.claims.find((claim) => claim.subject === 'unknown');\n  assert.ok(ambiguous);\n  assert.equal(ambiguous?.text, '他现在不舒服');\n});\n\ntest('does not choose one person when a single clause explicitly names multiple people', () => {\n  const result = understandElderInput('我爸和我老公都摔了一跤', TODAY);\n\n  assert.match(result.clarificationQuestion ?? '', /指谁|确认清楚/);\n  assert.ok(result.claims.some((claim) => claim.subject === 'unknown'));\n});\n\ntest('keeps a self claim separate from a nearby family claim', () => {\n  const result = understandElderInput('我爸走路不稳然后我自己也有点头晕', TODAY);\n\n  assert.equal(result.clarificationQuestion, undefined);\n  assert.equal(result.claims[0]?.subject, 'father');\n  assert.equal(result.claims[1]?.subject, 'self');\n  assert.deepEqual(result.claims[1]?.tags, ['dizziness']);\n});\n''')\n          PY\n\n      - name: Commit patch\n        run: |\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add route1-health-agent/src/engine/understanding.ts route1-health-agent/tests/multi-fact-regression.test.ts\n          git commit -m "fix(route1): harden multi-fact claim splitting"\n          git push\n
name: route1-semantic-fix-temp
on:
  push:
    branches: [route1/final-green]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: route1/final-green
          fetch-depth: 0
      - name: Patch semantic compatibility
        working-directory: route1-health-agent
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'{path}: target text not found')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/types.ts',
              "export type ClaimStatus = 'occurred' | 'negated' | 'hypothetical' | 'uncertain';",
              "export type ClaimStatus = 'occurred' | 'negated' | 'hypothetical' | 'uncertain' | 'near_miss';",
          )

          replace_once(
              'src/engine/agent.ts',
              "    patterns: [/血压(有)?(高|偏高)/, /高压\\d{3}/],",
              "    patterns: [\n      /血压(有)?(高|偏高)/,\n      /血压\\s*(?:\\d{2,3}|[零〇一二两三四五六七八九十百]+)(?:\\s*[/／,，比\\-至~]\\s*(?:\\d{2,3}|[零〇一二两三四五六七八九十百]+))?/,\n      /高压(?:\\d{2,3}|[零〇一二两三四五六七八九十百]+)/,\n    ],",
          )

          understanding = Path('src/engine/understanding.ts')
          s = understanding.read_text()

          s = s.replace(
              "export type ClaimStatus = 'occurred' | 'negated' | 'hypothetical' | 'uncertain';",
              "export type ClaimStatus = 'occurred' | 'negated' | 'hypothetical' | 'uncertain' | 'near_miss';",
              1,
          )

          start = s.index('function splitClauses(text: string): string[] {')
          end = s.index('\n}\n\nfunction inferPronounSubject', start) + 2
          split_fn = '''function splitClauses(text: string): string[] {\n  return text\n    .split(/[。！？!?；;，,\\n]+(?!\\s*(?:也(?:没|没有|未)|并(?:没|没有)|幸好|好在))/)\n    .map((clause) => clause.trim())\n    .filter(Boolean);\n}'''
          s = s[:start] + split_fn + s[end:]

          start = s.index('function statusFromText(')
          end = s.index('\n}\n\nfunction recentPriorSubjects', start) + 2
          status_fn = '''function statusFromText(clause: string, tags: SymptomTag[], hasHealthValue: boolean): ClaimStatus {\n  const semanticSymptomLanguage = /(心慌|心悸|摔倒|跌倒|喘|胸闷|胸痛|头晕|头昏|疼|痛|肿|失眠|睡不好|起夜|漏服|忘记吃|血压|心率|体重|气短|憋气)/.test(clause);\n\n  if (/(如果|假如|万一|要是|怎么预防|怎么办才不会)/.test(clause) && (tags.length > 0 || hasHealthValue || semanticSymptomLanguage)) {\n    return 'hypothetical';\n  }\n\n  if (/(差点|差一点|差点儿|险些).{0,8}(摔|跌|撞|滑倒|晕倒)/.test(clause)) return 'near_miss';\n\n  // “没吃药/没服药/忘了吃药”表达的是已经发生的用药遗漏。\n  if (tags.includes('medicationMissed') && /(没|没有|未|忘|漏).{0,6}(吃|服|用)?(?:了)?药/.test(clause)) {\n    return 'occurred';\n  }\n\n  if (tags.includes('poorSleep') && /没睡好/.test(clause)) return 'occurred';\n\n  const comparativeImprovement =\n    /(今天|现在|目前)/.test(clause) &&\n    /(没|没有|不再|不那么)/.test(clause) &&\n    /(像|那么|这么|那样|比)/.test(clause) &&\n    /(喘|胸闷|疼|痛|头晕|肿|失眠|起夜|漏服|忘记吃|血压|心率|体重|睡)/.test(clause);\n  if (comparativeImprovement && (tags.length > 0 || hasHealthValue)) return 'occurred';\n  if (\n    /(今天|现在|目前)/.test(clause) &&\n    /(好多了|好一点|好些了|轻一点|减轻|缓解|没那么)/.test(clause) &&\n    tags.length > 0\n  ) {\n    return 'occurred';\n  }\n\n  if (\n    /(没|没有|未曾|从来没|并没有|不是).{0,5}(摔|跌|喘|胸闷|疼|痛|头晕|肿|失眠|起夜|漏服|忘记吃|血压|心率|体重|睡)/.test(\n      clause,\n    )\n  ) {\n    return 'negated';\n  }\n  if (/(可能|好像|似乎|不太确定|不清楚)/.test(clause) && (tags.length > 0 || hasHealthValue || semanticSymptomLanguage)) {\n    return 'uncertain';\n  }\n  return 'occurred';\n}'''
          s = s[:start] + status_fn + s[end:]

          old_line = "    if (tags.length === 0 && !hasHealthValue && subject !== 'unknown') {"
          new_line = "    if (tags.length === 0 && !hasHealthValue && subject !== 'unknown' && status === 'occurred') {"
          if new_line not in s:
              if old_line not in s:
                  raise SystemExit('understanding.ts: claim suppression target not found')
              s = s.replace(old_line, new_line, 1)

          understanding.write_text(s)

      - name: Format changed files
        working-directory: route1-health-agent
        run: npx --yes prettier@3.5.3 --write src/types.ts src/engine/agent.ts src/engine/understanding.ts
      - name: Commit semantic fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add route1-health-agent/src/types.ts route1-health-agent/src/engine/agent.ts route1-health-agent/src/engine/understanding.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(route1): restore semantic status compatibility'
          git push origin HEAD:route1/final-green

name: route1-semantic-fix-temp
on:
  push:
    branches: [route1/final-green]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: route1/final-green
          fetch-depth: 0
      - name: Patch semantic compatibility
        working-directory: route1-health-agent
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}')
              p.write_text(s.replace(old, new, expected))

          replace(
              'src/types.ts',
              "export type ClaimStatus = 'occurred' | 'negated' | 'hypothetical' | 'uncertain';",
              "export type ClaimStatus = 'occurred' | 'negated' | 'hypothetical' | 'uncertain' | 'near_miss';",
          )

          replace(
              'src/engine/agent.ts',
              "    patterns: [/血压(有)?(高|偏高)/, /高压\\d{3}/],",
              "    patterns: [\n      /血压(有)?(高|偏高)/,\n      /血压\\s*(?:\\d{2,3}|[零〇一二两三四五六七八九十百]+)(?:\\s*[/／,，比\\-至~]\\s*(?:\\d{2,3}|[零〇一二两三四五六七八九十百]+))?/,\n      /高压(?:\\d{2,3}|[零〇一二两三四五六七八九十百]+)/,\n    ],",
          )

          replace(
              'src/engine/understanding.ts',
              "export type ClaimStatus = 'occurred' | 'negated' | 'hypothetical' | 'uncertain';",
              "export type ClaimStatus = 'occurred' | 'negated' | 'hypothetical' | 'uncertain' | 'near_miss';",
          )

          replace(
              'src/engine/understanding.ts',
              ".split(/[。！？!?；;，,\\n]+)",
              ".split(/[。！？!?；;，,\\n]+(?!\\s*(?:也(?:没|没有|未)|并(?:没|没有)|幸好|好在))/)",
          )

          replace(
              'src/engine/understanding.ts',
              "function statusFromText(clause: string, tags: SymptomTag[], hasHealthValue: boolean): ClaimStatus {\n  if (/(如果|假如|万一|要是|怎么预防|怎么办才不会)/.test(clause) && (tags.length > 0 || hasHealthValue)) {",
              "function statusFromText(clause: string, tags: SymptomTag[], hasHealthValue: boolean): ClaimStatus {\n  const semanticSymptomLanguage = /(心慌|心悸|摔倒|跌倒|喘|胸闷|胸痛|头晕|头昏|疼|痛|肿|失眠|睡不好|起夜|漏服|忘记吃|血压|心率|体重|气短|憋气)/.test(clause);\n\n  if (/(如果|假如|万一|要是|怎么预防|怎么办才不会)/.test(clause) && (tags.length > 0 || hasHealthValue || semanticSymptomLanguage)) {",
          )

          replace(
              'src/engine/understanding.ts',
              "  // “没吃药/没服药/忘了吃药”表达的是已经发生的用药遗漏，\n  // 虽然表面有否定词，但业务事件本身是“漏服药物”而不是“没有漏服”。",
              "  if (/(差点|差一点|差点儿|险些).{0,8}(摔|跌|撞|滑倒|晕倒)/.test(clause)) return 'near_miss';\n\n  // “没吃药/没服药/忘了吃药”表达的是已经发生的用药遗漏，\n  // 虽然表面有否定词，但业务事件本身是“漏服药物”而不是“没有漏服”。",
          )

          replace(
              'src/engine/understanding.ts',
              "  if (/(可能|好像|似乎|不太确定|不清楚)/.test(clause) && (tags.length > 0 || hasHealthValue)) {",
              "  if (/(可能|好像|似乎|不太确定|不清楚)/.test(clause) && (tags.length > 0 || hasHealthValue || semanticSymptomLanguage)) {",
          )

          replace(
              'src/engine/understanding.ts',
              "    if (tags.length === 0 && !hasHealthValue && subject !== 'unknown') {",
              "    if (tags.length === 0 && !hasHealthValue && subject !== 'unknown' && status === 'occurred') {",
          )

      - name: Format changed files
        working-directory: route1-health-agent
        run: npx --yes prettier@3.5.3 --write src/types.ts src/engine/agent.ts src/engine/understanding.ts
      - name: Commit semantic fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add route1-health-agent/src/types.ts route1-health-agent/src/engine/agent.ts route1-health-agent/src/engine/understanding.ts
          git commit -m 'fix(route1): restore semantic status compatibility'
          git push origin HEAD:route1/final-green
